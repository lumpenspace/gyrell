# Prime Intellect Hosted Training — Codewords self-play run (GRPO).
#
# Training: the policy plays the red team; the blue team is played by the
# SAME model being trained ("policy" driver) — a live opponent that gets
# stronger as training progresses, billed at PI's own per-token rates.
#
# Evaluation: every 25 steps the current checkpoint plays held-out boards
# against a POOL of live OpenRouter opponents — uniform teams and mixed
# cluegiver/guesser combinations across different labs. One matchup is chosen
# per board (deterministic in the seed), and each rollout records it in
# game_result["seat_models"], so results can be sliced per matchup. This is
# the cross-play check: conventions learned in self-play must survive against
# other models.
#
# Environment: lumpenspace/gyrell (pushed from environments/gyrell).
# Requires OPENROUTER_API_KEY in your shell (it is, via ~/.zshenv).
#
# Launch (the -e flag forwards the OpenRouter key to the training containers):
#   prime train configs/codewords-rl-selfplay.toml -e OPENROUTER_API_KEY
#
# Cost notes: self-play roughly doubles per-rollout PI token volume vs
# scripted (blue's turns are billed but not trained). The OpenRouter eval is
# ~16 games per eval pass (~$0.30-0.50 with these models).

model = "Qwen/Qwen2.5-3B-Instruct"
loss = "rl"
max_steps = 75             # sized to wallet: self-play bills both sides, ~$0.3-0.4/step

batch_size = 48            # rollouts per optimizer step (6 boards x 8)
rollouts_per_example = 8   # GRPO group size

[sampling]
max_tokens = 400
temperature = 0.7
enable_thinking = false

# ---------------------------------------------------------------------------
# Training: self-play (live opponent = the model being trained)
# ---------------------------------------------------------------------------
[[env]]
id = "lumpenspace/gyrell"
args = { role = "team", opponent = "policy", max_turns = 40, num_train_examples = 4000, num_eval_examples = 200 }

# Alternative: train directly against a pool of live OpenRouter matchups
# instead of (or, as a second [[env]] block, in addition to) self-play.
# Mind OpenRouter rate limits at 64 concurrent rollouts.
# [[env]]
# id = "lumpenspace/gyrell"
# args = { role = "team", max_turns = 40, opponent = [
#   { model = "openai/gpt-4o-mini" },
#   { model = "anthropic/claude-3.5-haiku" },
#   { cluegiver = { model = "anthropic/claude-3.5-haiku" }, guesser = { model = "openai/gpt-4o-mini" } },
# ] }

# ---------------------------------------------------------------------------
# Evaluation: cross-play vs varied live LLM combinations (held-out boards)
# ---------------------------------------------------------------------------
[eval]
interval = 25
num_examples = 16
rollouts_per_example = 1

# Eval does NOT inherit [sampling] — without this block, Qwen2.5 evals run
# with thinking enabled and default token limits, drowning the JSON protocol
# in reasoning text (every turn scores as a format error).
[eval.sampling]
max_tokens = 400
temperature = 0.7
enable_thinking = false

[[eval.env]]
id = "lumpenspace/gyrell"
args = { role = "cluegiver", max_turns = 40, num_train_examples = 4000, num_eval_examples = 200, partner = [
  { model = "openai/gpt-4o-mini" },
  { model = "anthropic/claude-3.5-haiku" },
  { model = "google/gemini-2.0-flash-lite" }
], opponent = "scripted" }

[checkpoints]
interval = 50
keep_cloud = 3
