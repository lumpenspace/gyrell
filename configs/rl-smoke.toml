# Prime Intellect Hosted Training — Codewords smoke run (GRPO).
#
# Environment: lumpenspace/gyrell (pushed from environments/gyrell).
#
# Launch:            prime train configs/codewords-rl-smoke.toml
# Watch:             prime train list / prime train logs <run-id> / prime train metrics <run-id>
# Rollout samples:   prime train rollouts <run-id>
#
# Ballpark cost: a full game is ~30k input / ~2k output tokens per rollout;
# at 64 rollouts/step on Qwen2.5-3B-Instruct this is roughly $0.15-0.25 per step, so
# ~$8-15 for the 50-step smoke run. Swap in Qwen/Qwen2.5-0.5B-Instruct (3x cheaper) to
# test the pipeline, or Qwen/Qwen2.5-7B-Instruct (2x cost) for stronger play.

model = "Qwen/Qwen2.5-3B-Instruct"
loss = "rl"
max_steps = 50

batch_size = 64            # rollouts per optimizer step
rollouts_per_example = 8   # GRPO group size (8 boards x 8 rollouts per step)

[sampling]
max_tokens = 400           # one Codewords action never needs more
temperature = 0.7
enable_thinking = false    # keep turns short and cheap for the smoke run

[[env]]
id = "lumpenspace/gyrell"
# Scripted opponents: free, deterministic, stationary — right for a first run.
# Later options:
#   opponent = "policy"                       -> self-play vs the training model
#   opponent = { model = "openai/gpt-4o-mini",
#                base_url = "https://openrouter.ai/api/v1",
#                api_key_var = "OPENROUTER_API_KEY" }
#     (pass the secret at launch: prime train ... -e OPENROUTER_API_KEY)
args = { role = "team", max_turns = 40, num_train_examples = 2000, num_eval_examples = 200 }

# Held-out eval on the env's eval split every 25 steps (and before step 0,
# so you get a base-model reference point).
[eval]
interval = 25
num_examples = 16
rollouts_per_example = 1

[[eval.env]]
id = "lumpenspace/gyrell"
args = { role = "team", max_turns = 40, num_train_examples = 2000, num_eval_examples = 200 }

[checkpoints]
interval = 25
keep_cloud = 2
