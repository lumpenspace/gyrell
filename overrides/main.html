{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <link rel="apple-touch-icon" sizes="180x180" href="{{ 'assets/apple-touch-icon.png' | url }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ 'assets/icon-192.png' | url }}">
  <link rel="icon" type="image/png" sizes="512x512" href="{{ 'assets/icon-512.png' | url }}">
  <link rel="manifest" href="{{ 'assets/site.webmanifest' | url }}">
  <meta name="theme-color" content="#0f1115">

  <!-- OpenGraph Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="GyReLL — gyre's RL environment for ludic learning">
  <meta property="og:description" content="gyre's RL environment for ludic learning. Describe games as turngames specs and run baseline/LLM matches, Elo rankings, and an around-the-clock spectator show.">
  <meta property="og:url" content="https://gyrell.hyperplex.org/">
  <meta property="og:image" content="https://gyrell.hyperplex.org/assets/cover.webp">
  <meta property="og:image:type" content="image/webp">
  <meta property="og:image:width" content="1536">
  <meta property="og:image:height" content="1024">

  <!-- Twitter Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="GyReLL — gyre's RL environment for ludic learning">
  <meta name="twitter:description" content="gyre's RL environment for ludic learning. Describe games as turngames specs and run baseline/LLM matches, Elo rankings, and an around-the-clock spectator show.">
  <meta name="twitter:image" content="https://gyrell.hyperplex.org/assets/cover.webp">
{% endblock %}
